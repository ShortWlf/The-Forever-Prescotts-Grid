<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Chat - Forever Prescotts Grid</title>
    <style>
        :root {
            --bg-dark: #0d131a;
            --bg-card: #141d26;
            --accent-blue: #2a6f97;
            --accent-glow: #01c4e7;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --wood-trim: #8c6239;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(13, 19, 26, 0.95);
            border-bottom: 2px solid var(--wood-trim);
            padding: 1rem 2rem;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo span { color: var(--accent-glow); }

        .main-content {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            gap: 1.5rem;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 1.5rem 1rem;
            height: fit-content;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar h2 {
            color: var(--accent-glow);
            margin-bottom: 1rem;
            padding-left: 1rem;
            font-size: 1.1rem;
        }
        .channel-btn {
            width: 100%;
            padding: 0.85rem 1rem;
            margin: 0.4rem 0;
            background-color: #1c2735;
            border: none;
            border-radius: 6px;
            color: var(--text-main);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .channel-btn:hover {
            background-color: #2a3a4f;
        }
        .channel-btn.active {
            background-color: var(--accent-blue);
            color: white;
        }

        /* Chat Panel */
        .chat-panel {
            flex: 1;
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .chat-panel h1 { font-size: 2rem; }
        .chat-panel h1 span { color: var(--accent-glow); }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            color: var(--text-muted);
            font-weight: 500;
        }
        input {
            background-color: #0d131a;
            border: 1px solid #2a6f97;
            color: white;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            font-size: 1.05rem;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-glow);
        }

        .start-btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 1rem;
        }
        .start-btn:hover {
            background-color: #34d399;
        }

        .iframe-wrapper {
            flex: 1;
            border-radius: 8px;
            overflow: hidden;
            background: #0a0f17;
            min-height: 600px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <div style="max-width:1400px; margin:0 auto; display:flex; justify-content:space-between; align-items:center;">
            <a href="index.html" class="logo">⚓ Forever <span>Prescotts</span></a>
        </div>
    </header>

    <div class="main-content">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>RADIO CHANNELS</h2>
            <button class="channel-btn active" data-channel="#foreverprescotts">⚓ General Chat</button>
            <button class="channel-btn" data-channel="#prescotts-docks">⛴ The Docks (In-World)</button>
            <button class="channel-btn" data-channel="#deepsea">🐟 Deep Sea Angling</button>
            <button class="channel-btn" data-channel="#derby">🏆 Derby & Tournaments</button>
            <button class="channel-btn" data-channel="#gear">🎣 Gear & Fishing HUDs</button>
            <button class="channel-btn" data-channel="#memorial">🕊 Memorial Lounge</button>
        </div>

        <!-- Main Chat Panel -->
        <div class="chat-panel">
            <h1>General Chat <span>Comms Deck</span></h1>
            <p>Main hub for grid chat, greeting new folks, and staying in touch.</p>

            <div class="input-group">
                <label>Nick</label>
                <input type="text" id="nick" placeholder="YourNick" maxlength="30">
            </div>

            <div class="input-group">
                <label>Channel</label>
                <input type="text" id="channel" readonly>
            </div>

            <button class="start-btn" onclick="startChat()">Start Chat</button>
        </div>
    </div>

    <div class="iframe-wrapper" id="iframeWrapper" style="display:none; margin: 0 2rem 2rem 2rem; height: 700px;"></div>

    <script src="chat.js"></script>
</body>
</html>
