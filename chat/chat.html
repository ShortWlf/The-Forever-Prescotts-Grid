<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Chat - Forever Prescotts Grid</title>
    <style>
        :root {
            --bg-dark: #0d131a;
            --bg-card: #141d26;
            --accent-blue: #2a6f97;
            --accent-glow: #01c4e7;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --wood-trim: #8c6239;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: rgba(13, 19, 26, 0.95);
            border-bottom: 2px solid var(--wood-trim);
            width: 100%;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            text-decoration: none;
        }
        .logo span { color: var(--accent-glow); }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
        }
        .nav-links a:hover { color: var(--accent-glow); }

        .chat-container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .chat-header {
            background-color: var(--bg-card);
            padding: 1.5rem;
            border-radius: 8px 8px 0 0;
            border-top: 3px solid var(--accent-blue);
        }
        .chat-header h1 {
            font-size: 1.8rem;
        }
        .chat-header h1 span { color: var(--accent-glow); }

        /* Nickname + Channel Bar */
        .control-bar {
            background-color: var(--bg-card);
            padding: 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        label {
            color: var(--text-muted);
            white-space: nowrap;
        }
        input, select {
            background-color: #0d131a;
            border: 1px solid #2a6f97;
            color: var(--text-main);
            padding: 0.65rem 1rem;
            border-radius: 6px;
        }
        .join-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.65rem 1.8rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .join-btn:hover {
            background-color: var(--accent-glow);
            color: #000;
        }

        .iframe-wrapper {
            flex: 1;
            background-color: var(--bg-card);
            border-radius: 0 0 8px 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
            min-height: 650px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        footer {
            background-color: #080c11;
            padding: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .control-bar { flex-direction: column; align-items: stretch; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">⚓ Forever <span>Prescotts</span></a>
            <ul class="nav-links">
                <li><a href="index.html#about">The Dream</a></li>
                <li><a href="index.html#specs">Specifications</a></li>
                <li><a href="index.html#connect">How to Connect</a></li>
                <li><a href="chat.html" style="color: var(--accent-glow);">Chat</a></li>
            </ul>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Grid <span>Comms Deck</span></h1>
            <p>Connect with other grid anglers, swap stories, and coordinate events.</p>
        </div>

        <!-- Control Bar -->
        <div class="control-bar">
            <div class="control-group">
                <label for="nick">Nickname:</label>
                <input type="text" id="nick" placeholder="Angler123" maxlength="30" style="width: 220px;">
            </div>

            <div class="control-group">
                <label for="channel-select">Channel:</label>
                <select id="channel-select" style="width: 260px;">
                    <option value="#foreverprescotts">⚓ General Chat (#foreverprescotts)</option>
                    <option value="#prescotts-docks">⛴ The Docks (In-World)</option>
                    <option value="#deepsea">🐟 Deep Sea Angling</option>
                    <option value="#derby">🏆 Derby & Tournaments</option>
                    <option value="#gear">🎣 Gear & Fishing HUDs</option>
                    <option value="#memorial">🕊 Memorial Lounge</option>
                </select>
            </div>

            <button class="join-btn" onclick="joinChat()">Join Chat</button>
        </div>

        <div class="iframe-wrapper" id="iframeWrapper">
            <!-- Iframe loaded by JS -->
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Forever Prescotts Grid. Built with respect and community spirit.</p>
    </footer>

    <script src="chat.js"></script>
</body>
</html>
