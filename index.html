<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forever Prescotts - OpenSimulator Grid</title>
    <style>
        /* --- Theme Variables --- */
        :root {
            --bg-dark: #0d131a;
            --bg-card: #141d26;
            --accent-blue: #2a6f97;
            --accent-glow: #01c4e7;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --wood-trim: #8c6239;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; scroll-behavior: smooth; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }

        header { background-color: rgba(13, 19, 26, 0.95); border-bottom: 2px solid var(--wood-trim); position: fixed; width: 100%; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--accent-glow); }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--accent-glow); }

        .hero { padding: 8rem 2rem 4rem 2rem; background: linear-gradient(180deg, rgba(20,29,38,0.3) 0%, rgba(13,19,26,1) 100%); text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hero-content { max-width: 800px; margin: 0 auto; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; letter-spacing: 1px; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem; }
        .quote-box { border-left: 4px solid var(--wood-trim); background-color: var(--bg-card); padding: 1rem; margin: 2rem auto; font-style: italic; max-width: 600px; border-radius: 0 8px 8px 0; }

        .status-bar { background-color: var(--bg-card); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; max-width: 1000px; margin: -2rem auto 4rem auto; display: flex; justify-content: space-around; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; z-index: 10; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: var(--accent-glow); }
        .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        section { padding: 4rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        h2 { font-size: 2rem; margin-bottom: 2rem; text-align: center; }
        h2 span { color: var(--accent-blue); }
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; }
        .card { background-color: var(--bg-card); padding: 2rem; border-radius: 8px; border-top: 3px solid var(--accent-blue); }
        .map-wrapper { background-color: var(--bg-card); padding: 2rem; border-radius: 8px; max-width: 500px; margin: 0 auto; text-align: center; }
        .grid-map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 1.5rem; }
        .map-region { background-color: var(--bg-dark); border: 1px solid rgba(255,255,255,0.1); padding: 1.5rem 0; font-size: 0.85rem; border-radius: 4px; color: var(--text-muted); }
        .map-region.center { border: 1px solid var(--accent-glow); background-color: rgba(1, 196, 231, 0.05); color: var(--accent-glow); font-weight: bold; }
        .connect-box { background-color: var(--bg-card); padding: 2.5rem; border-radius: 8px; max-width: 800px; margin: 0 auto; }
        .uri-display { background-color: var(--bg-dark); border: 1px dashed var(--accent-glow); padding: 1rem; text-align: center; font-family: monospace; font-size: 1.2rem; color: var(--accent-glow); margin: 1.5rem 0; border-radius: 4px; }
        footer { background-color: #080c11; padding: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); }

        @media (max-width: 768px) { .nav-links { display: none; } .status-bar { flex-direction: column; gap: 1.5rem; margin-top: 2rem; } }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo">⚓ Forever <span>Prescotts</span></a>
            <ul class="nav-links">
                <li><a href="#about">The Dream</a></li>
                <li><a href="#connect">How to Connect</a></li>
                <li><a href="http://rff.ddns.net:8002/wifi/user/account/">Register</a></li>
            </ul>
        </div>
    </header>

    <section class="hero" id="about">
        <div class="hero-content">
            <h1>Forever Prescotts Grid</h1>
            <p>An OpenSimulator space built in loving memory of Joe Prescott.</p>
            <div class="quote-box">"Tight lines and calm waters, always."</div>
        </div>
    </section>

    <div class="status-bar">
        <div class="stat-item">
            <div class="stat-value" id="grid-status" style="color: #ff4d4d;">Offline</div>
            <div class="stat-label">Grid Status</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="active-users">--</div>
            <div class="stat-label">Anglers In-World</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">9</div>
            <div class="stat-label">Total Regions</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">720K</div>
            <div class="stat-label">Total Prim Capacity</div>
        </div>
    </div>

    <script>
        async function checkGridStatus() {
            const statusElement = document.getElementById('grid-status');
            
            // We ping your status page via a public proxy
            const statusPage = 'https://stats.uptimerobot.com/nsCBZUxQ9V';
            const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(statusPage);

            try {
                const response = await fetch(proxy);
                const data = await response.json();
                
                // If the status page text contains "UP", the grid is online
                if (data.contents.includes('UP')) {
                    statusElement.innerText = "Online";
                    statusElement.style.color = "#01c4e7";
                } else {
                    statusElement.innerText = "Offline";
                    statusElement.style.color = "#ff4d4d";
                }
            } catch (e) {
                statusElement.innerText = "Offline";
                statusElement.style.color = "#ff4d4d";
            }
        }
        
        checkGridStatus();
        setInterval(checkGridStatus, 60000); // Checks every minute
    </script>
</body>
</html>
